<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7BB661">
<title>Lớp C4 của chúng mình · MN Uy Nỗ</title>
<meta property="og:title" content="Lớp C4 của chúng mình">
<meta property="og:description" content="Trang kỷ niệm lớp Mẫu giáo bé C4 · Mầm non Uy Nỗ · Năm học 2026–2027">
<meta property="og:image" content="https://c4uyno2627.github.io/og.png">
<meta property="og:url" content="https://c4uyno2627.github.io/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --kem:#FFF8EC; --kem2:#FDEFD8; --la:#7BB661; --la-dam:#4F8A3C; --la-nhat:#CFE8B8;
  --nang:#FFD166; --dao:#F7A8B4; --dao-dam:#E46C86; --bang:#2E4A3B; --go:#B98B5B; --nau:#8B5E3C; --chu:#4A3B2C; --chu-nhat:#8A7663;
  --bong:0 6px 18px rgba(120,80,40,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--kem)}
html,body{margin:0;color:var(--chu);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3,.tieu{font-family:'Baloo 2','Be Vietnam Pro',sans-serif;line-height:1.2;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.khung{max-width:560px;margin:0 auto;padding:0 16px 96px}
.an{display:none!important}

/* ===== Nền trời ===== */
.troi{position:fixed;inset:0;z-index:-1;background:linear-gradient(#E9F6FF 0%,#FFF8EC 45%,#FFF8EC 100%)}
.may{position:absolute;background:#fff;border-radius:50px;opacity:.85;animation:troi 60s linear infinite}
.may::before,.may::after{content:"";position:absolute;background:#fff;border-radius:50%}
.may::before{width:50%;height:160%;left:15%;top:-60%}
.may::after{width:35%;height:130%;right:15%;top:-45%}
@keyframes troi{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}

/* ===== Cổng vào ===== */
.dau-trang{text-align:center;padding:28px 0 8px}
.dau-trang .nho{font-size:14px;color:var(--chu-nhat)}
.dau-trang h1{color:var(--la-dam);margin-top:6px;line-height:.95}
.dau-trang h1 .lop{display:block;font-size:64px;font-weight:800;letter-spacing:-.01em;text-shadow:0 3px 0 #fff,0 5px 0 rgba(79,138,60,.18)}
.dau-trang h1 .cua{display:block;font-size:26px;font-weight:700;color:var(--chu);margin-top:4px}
.dau-trang p{margin:4px 0 0;color:var(--chu-nhat);font-size:15px}
.loi-moi{text-align:center;background:#fff;border-radius:16px;padding:10px 14px;margin:14px auto 0;box-shadow:var(--bong);font-size:15px;max-width:420px}

/* ===== Cây vườn ươm ===== */
.cay{position:relative;margin:18px auto 0;max-width:520px}
.tan{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:52px 22px 50px;isolation:isolate;z-index:1}
.tan>svg.nen{position:absolute;left:0;top:0;z-index:-1;overflow:visible;pointer-events:none}
.hang{position:relative;display:flex;justify-content:center;align-items:flex-start;white-space:nowrap}
.hoa{display:flex;flex-direction:column;align-items:center;flex:none;min-width:54px;padding:4px 1px;border-radius:14px;transition:transform .2s}
.hoa:active{transform:scale(.92)}
.hoa svg{width:46px;height:46px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.hoa{position:relative}
.hoa .may-bay{position:absolute;top:0;right:2px;font-size:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.hoa .ten small{display:block;font-size:10px;font-weight:500;opacity:.75}
.hoa .ten{white-space:nowrap;font-size:12px;font-weight:600;color:#2F4A22;margin-top:2px;line-height:1.15;text-align:center;background:rgba(255,255,255,.55);padding:1px 6px;border-radius:8px;max-width:100%}
.hoa.cua-toi svg{animation:sang 1.6s ease-in-out infinite}
.hoa.cua-toi .ten{background:var(--nang);color:var(--chu)}
@keyframes sang{0%,100%{filter:drop-shadow(0 0 0 rgba(255,209,102,0))}50%{filter:drop-shadow(0 0 10px #FFD166) drop-shadow(0 0 4px #fff)}}
.hoa.cho svg{opacity:.45}
.goc{display:block;width:100%;max-width:420px;height:auto;margin:-26px auto 0;position:relative;z-index:0}
.nguoi-lam-vuon{display:flex;justify-content:center;gap:14px;margin-top:-10px;position:relative;z-index:2}
.co-btn{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 16px 8px 10px;box-shadow:var(--bong);font-weight:600}
.co-btn .ico{font-size:24px}
.ghi-chu-cong{text-align:center;font-size:13px;color:var(--chu-nhat);margin-top:14px}

/* ===== Hộp nhập mã ===== */
.phu{position:fixed;inset:0;background:rgba(74,59,44,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:hien .2s}
@media(min-width:600px){.phu{align-items:center}}
@keyframes hien{from{opacity:0}}
.hop{background:var(--kem);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;animation:len .25s ease-out}
@media(min-width:600px){.hop{border-radius:24px}}
@keyframes len{from{transform:translateY(40px)}}
.hop .hoa-lon svg{width:72px;height:72px}
.hop h3{font-size:24px;margin:6px 0 2px}
.hop p{margin:0 0 14px;color:var(--chu-nhat);font-size:15px}
.o-ma{width:180px;font-family:'Baloo 2','Be Vietnam Pro',sans-serif;font-size:34px;letter-spacing:.3em;text-align:center;padding:8px 0 4px 10px;border:3px solid var(--la-nhat);border-radius:16px;background:#fff;color:var(--chu);outline:none}
.o-ma:focus{border-color:var(--la)}
.rung{animation:rung .4s}
@keyframes rung{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.loi{color:var(--dao-dam);font-size:14px;min-height:22px;margin-top:8px}
.nut{display:inline-block;background:var(--la);color:#fff;font-weight:700;font-size:17px;padding:12px 28px;border-radius:999px;box-shadow:0 4px 0 var(--la-dam);margin-top:6px}
.nut:active{transform:translateY(3px);box-shadow:0 1px 0 var(--la-dam)}
.nut-phu{display:block;margin:12px auto 0;color:var(--chu-nhat);font-size:14px;text-decoration:underline}

/* ===== Màn chào khi vào ===== */
.man-chao{position:fixed;inset:0;z-index:60;background:radial-gradient(circle,#FFF4D6,#FFE3B3);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:hien .3s}
.man-chao svg{width:140px;height:140px;animation:no 1.2s cubic-bezier(.2,1.6,.4,1)}
@keyframes no{from{transform:scale(.1) rotate(-90deg)}}
.man-chao h2{font-size:34px;color:var(--la-dam);margin-top:12px}
.man-chao p{font-size:17px;max-width:340px}

/* ===== Nội dung chính ===== */
.thanh-tren{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.thanh-tren .logo{font-family:'Baloo 2','Be Vietnam Pro',sans-serif;font-weight:800;font-size:20px;color:var(--la-dam)}
.nut-nhac{width:34px;height:34px;padding:0!important;display:flex;align-items:center;justify-content:center;font-size:16px!important;background:#fff;border-radius:50%;box-shadow:var(--bong)}
#cong{position:relative}
.nhac-cong{position:absolute;top:12px;right:12px;z-index:5}
.nut-nhac.dang-phat{animation:nhun 1.6s ease-in-out infinite}
@keyframes nhun{50%{transform:scale(1.08)}}
.thanh-tren button{font-size:13px;color:var(--chu-nhat);background:#fff;padding:6px 12px;border-radius:999px;box-shadow:var(--bong)}
.the{background:#fff;border-radius:22px;padding:18px;box-shadow:0 2px 0 #EADCC4;border:1px solid #F3E8D6;margin-top:16px}
.chao-lon h2{font-size:30px;color:var(--la-dam)}
.chao-troi{padding:10px 4px 2px}
.chao-troi h2{font-size:34px;line-height:1.1}
.chao-troi p{font-size:16px;color:var(--chu)}
.chao-lon p{margin:6px 0 0}
.dip{display:inline-block;background:var(--dao);color:#fff;font-weight:600;font-size:13px;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.bang-den{margin-top:16px;background:radial-gradient(ellipse at 30% 20%,#3B5C4A,var(--bang) 70%);border:9px solid var(--go);border-radius:12px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15),0 3px 0 #9B7349;padding:14px 8px 10px;color:#F4F1E6;position:relative}
.bang-den::after{content:"";position:absolute;left:18%;right:18%;bottom:-9px;height:5px;background:#9B7349;border-radius:0 0 4px 4px}
.so-dem{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.so-dem div+div{border-left:1px dashed rgba(244,241,230,.25)}
.so-dem b{display:block;font-family:'Baloo 2','Be Vietnam Pro',sans-serif;font-size:32px;font-weight:700;line-height:1.05;color:#FFF6D8}
.so-dem span{font-size:12.5px;opacity:.82;line-height:1.3;display:block;padding:0 4px}
.tieu-de{display:flex;align-items:center;gap:8px;font-size:21px;color:var(--chu)}
.co-duoi{display:flex;justify-content:space-between;height:22px;margin:-18px -18px 10px;padding:0 6px;background:linear-gradient(#C9A26B,#C9A26B) top/100% 2px no-repeat}
.co-duoi i{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--c);margin-top:2px}
.sn-ds{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sn-ds span{background:var(--kem2);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.sn-ds small{font-weight:400;color:var(--chu-nhat);margin-left:2px}
.sn-ds span.hom-nay{background:var(--nang);font-weight:700}
.sn-ds span.qua{opacity:.6}
.nho-xam{font-size:13px;color:var(--chu-nhat)}
.thu{white-space:pre-line;font-size:16px;line-height:32px}
.giay-thu{background-color:#FFFEF8;background-image:linear-gradient(90deg,transparent 30px,#F5B9C3 30px,#F5B9C3 32px,transparent 32px),repeating-linear-gradient(transparent 0 31px,#DCE9F5 31px 32px);background-position:0 14px;padding:14px 16px 18px 44px;border:0;box-shadow:0 8px 18px rgba(110,80,40,.12);transform:rotate(-.6deg)}
.thu .ky{display:block;text-align:right;font-style:italic;margin-top:10px;color:var(--chu-nhat)}
.anh-gia{aspect-ratio:4/3;border-radius:16px;background:repeating-linear-gradient(45deg,var(--kem2),var(--kem2) 12px,#FBE6C6 12px,#FBE6C6 24px);display:flex;align-items:center;justify-content:center;color:var(--chu-nhat);font-size:14px;text-align:center;padding:10px}
.ke-chuyen{border-left:4px solid var(--dao);padding:6px 0 6px 12px;margin-top:12px}
.ke-chuyen .ai{font-size:13px;color:var(--chu-nhat);margin-top:2px}
.dong-tg{position:relative;margin-top:8px;padding-left:22px}
.dong-tg::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:3px;background:var(--la-nhat);border-radius:3px}
.moc{position:relative;margin-top:16px}
.moc::before{content:"";position:absolute;left:-21px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--la);border:3px solid #fff;box-shadow:0 0 0 2px var(--la)}
.moc.sap::before{background:#fff}
.moc h3{font-size:19px}
.moc .ngay{font-size:13px;color:var(--chu-nhat)}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.album .anh-gia{aspect-ratio:1;font-size:11px;border-radius:10px}
.sinh-nhat-lon{text-align:center;background:linear-gradient(135deg,#FFE29A,#FFC3BA);border-radius:20px;padding:20px;margin-top:14px}
.sinh-nhat-lon .banh{font-size:56px}
.sinh-nhat-lon h2{font-size:26px;color:#B24E43}

/* ===== Thanh dưới ===== */
.thanh-duoi{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 16px rgba(120,80,40,.1);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.thanh-duoi .trong{display:flex;max-width:560px;width:100%}
.thanh-duoi button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;padding:4px 0;border-radius:12px;color:var(--chu-nhat)}
.thanh-duoi button .i{font-size:22px;line-height:1.2}
.thanh-duoi button.dang{color:var(--la-dam);font-weight:700;background:#F1F8EA}

button:focus-visible,input:focus-visible{outline:3px solid var(--la-dam);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.phao{display:none}}
/* ===== Pháo giấy ===== */
.phao{position:fixed;top:-10px;width:10px;height:14px;z-index:70;pointer-events:none;animation:roi linear forwards}
@keyframes roi{to{transform:translateY(105vh) rotate(720deg)}}

/* ===== Bổ sung bản nâng cấp ===== */
.dang-mo{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--chu-nhat);font-size:14px;margin-top:10px;min-height:22px}
.xoay{width:18px;height:18px;border:3px solid var(--la-nhat);border-top-color:var(--la);border-radius:50%;animation:xoay .8s linear infinite}
@keyframes xoay{to{transform:rotate(360deg)}}
.bang-zalo{background:#FFF1C9;color:var(--chu);font-size:13px;text-align:center;padding:8px 12px;border-radius:12px;margin-top:12px}
.khung-hoa{position:relative;width:170px;height:170px;margin:0 auto}
.khung-hoa>svg{position:absolute;inset:0;width:100%;height:100%}
.khung-hoa button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.khung-hoa .anh-tron{width:84px;height:84px;border-width:4px}
.anh-tron{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.15);background:#fff;display:block;margin:0 auto}
.hoa.cua-toi .anh-tron{border-color:var(--nang);animation:sang 1.6s ease-in-out infinite}
.polaroid{background:#fff;padding:10px 10px 16px;border-radius:4px;box-shadow:0 8px 18px rgba(110,80,40,.16);transform:rotate(1deg);position:relative;margin:26px 6px 0}
.polaroid::before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:24px;margin-left:-48px;background:rgba(255,209,102,.65);transform:rotate(-3deg);border-radius:2px}
.polaroid .anh-that{border-radius:2px}
.polaroid .chu-anh{text-align:center;font-family:'Baloo 2','Be Vietnam Pro',sans-serif;font-size:17px;margin-top:8px;color:var(--chu)}
.anh-that{width:100%;border-radius:16px;display:block;background:var(--kem2);min-height:120px;object-fit:cover}
.album{gap:10px!important}
.album img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;background:var(--kem2);display:block;border:4px solid #fff;box-shadow:0 3px 8px rgba(110,80,40,.18)}
.album button:nth-child(3n+1) img{transform:rotate(-1.5deg)}
.album button:nth-child(3n+2) img{transform:rotate(1deg)}
.album button:nth-child(3n) img{transform:rotate(-.5deg)}
.album .them{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:10px;background:var(--la-nhat);font-weight:700;color:var(--la-dam)}
.moc .chua-anh{font-size:13px;color:var(--chu-nhat);margin-top:4px}
.tuong{display:grid;gap:10px;margin-top:12px}
.giay{background:#FFFBEA;border-radius:4px 14px 14px 14px;padding:12px 14px;box-shadow:0 2px 6px rgba(120,80,40,.1);transform:rotate(-.6deg)}
.giay:nth-child(2n){background:#FDEFF0;transform:rotate(.6deg)}
.giay:nth-child(3n){background:#EEF7E6}
.giay .ai{font-size:13px;color:var(--chu-nhat);margin-top:4px}
.video{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;margin-top:10px;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.loi-bo-me{font-size:16px;white-space:pre-line;background:var(--kem);border-radius:14px;padding:12px 14px;margin-top:10px}
.khoa-thu{text-align:center}
.khoa-thu .o-khoa{font-size:40px}
/* Xem ảnh */
.xem-anh{position:fixed;inset:0;z-index:80;background:rgba(20,15,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:hien .2s}
.xem-anh img{max-width:100%;max-height:78vh;object-fit:contain}
.xem-anh .chu{color:#fff;font-size:15px;margin-top:10px;padding:0 16px;text-align:center;min-height:22px}
.xem-anh .dk{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:34px;width:52px;height:72px}
.xem-anh .trai{left:0}.xem-anh .phai{right:0}
.xem-anh .dong{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;color:#fff;font-size:30px;width:44px;height:44px}
.xem-anh .dem{color:#bbb;font-size:13px;margin-top:4px}

.album button{padding:0;display:block;width:100%}
img.hong{background:repeating-linear-gradient(45deg,var(--kem2),var(--kem2) 8px,#FBE6C6 8px,#FBE6C6 16px);min-height:60px}

audio.giong{width:100%;height:40px;margin:4px 0}
.dong-giong{padding:8px 0;border-top:1px dashed #eadfcf}.dong-giong:first-of-type{border-top:0}
.dong-giong b{display:block;font-size:15px;margin-bottom:2px}
.dem-ngay{display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
.dem-ngay .so{font-family:'Baloo 2',cursive;font-size:44px;font-weight:800;color:var(--la-dam);line-height:1}
.cau-noi{font-size:17px;font-style:italic;padding:8px 12px;margin:6px 0;background:var(--kem);border-left:4px solid var(--nang);border-radius:8px}
.thu-khoa{text-align:center}.thu-khoa .phong-bi{font-size:44px}
.sap-co{background:#F4FAEE;border:1.5px dashed var(--la)}.sap-co p{margin:6px 0}
a.nut{display:inline-block;text-decoration:none;margin-top:10px}
.hai-moc{position:relative;display:inline-block}
.hai-moc .cuoi{position:absolute;inset:0;animation:moc-doi 8s ease-in-out infinite}
.hai-moc .nhan{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;background:var(--nang);color:var(--chu);padding:1px 8px;border-radius:99px;white-space:nowrap}
.hai-moc .nhan.sau{background:var(--dao-dam);color:#fff;animation:moc-doi 8s ease-in-out infinite}
.hai-moc .nhan.dau{animation:moc-doi-nguoc 8s ease-in-out infinite}
@keyframes moc-doi{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
@keyframes moc-doi-nguoc{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.hai-moc .cuoi,.hai-moc .nhan{animation:none}.hai-moc .cuoi,.hai-moc .nhan.dau{opacity:0}.hai-moc .nhan.sau{opacity:1}}
.co-nx .loi-co{font-size:17px;line-height:1.6;background:#FFF4F6;border-radius:12px;padding:12px 14px}
.co-nx .ky-co{text-align:right;font-style:italic;color:var(--chu-nhat);margin-top:6px}
.thu-moc{background:#FFF4F6;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:15px;line-height:1.65;white-space:pre-line}
.thu-moc b{display:block;color:var(--dao-dam);margin-bottom:4px}
/* ===== Màn mở quà cho cô ===== */
.mo-qua{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 38%,#fff6e0 0,#ffe3e8 45%,#f6c8d4 100%);cursor:pointer;transition:opacity .7s}
.mo-qua .gui{font-size:15px;color:#9a5a6a;letter-spacing:.02em}
.mo-qua h2{font-family:'Baloo 2',cursive;font-size:34px;line-height:1.1;color:#b23a57;margin:2px 0 26px}
.hop-qua{position:relative;width:180px;height:170px;animation:lac 2.4s ease-in-out infinite}

<script>

const MAU_HOA = ['#F7A8A0','#FFD166','#F4B6D2','#B8A9F0','#8FD3E8','#FFB077','#F28FAD','#A0D995','#FFC6A5','#C3B1E1'];
const $ = s => document.querySelector(s);

const chuanAnh = a => !a ? null : (typeof a==='string' ? {tep:a, chu:''} : a);

}
/* Tán cây: một khối tròn trơn, viền mềm */
function veNen(tan){
  const cu = tan.querySelector(':scope > svg.nen'); if (cu) cu.remove();

    <ellipse cx="${cx}" cy="${cy+8}" rx="${rx}" ry="${ry}" fill="#64A250"/>

}
function svgCo(s=28){

    <path d="M26 47l6 6 6-6" fill="#fff"/>
    <rect x="28" y="40" width="8" height="9" rx="3" fill="#FFD9B8"/>
    <ellipse cx="32" cy="31" rx="13" ry="14" fill="#FFE2C6"/>
    <path d="M19 28c3-9 10-12 19-10 4 1 6 4 7 8-6-1-12-4-15-8-2 5-6 8-11 10z" fill="#5B3A29"/>
    <circle cx="26.5" cy="32" r="1.8" fill="#4A3B2C"/><circle cx="37.5" cy="32" r="1.8" fill="#4A3B2C"/>
    <circle cx="23" cy="37" r="2.6" fill="#F7A8A0" opacity=".6"/><circle cx="41" cy="37" r="2.6" fill="#F7A8A0" opacity=".6"/>
    <path d="M28 38.5q4 3.5 8 0" stroke="#C0604F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function svgHoa(i){
  const mau = MAU_HOA[i%MAU_HOA.length], soCanh = [5,6,8][i%3];
  let canh = '';
  for(let k=0;k<soCanh;k++) canh += `<ellipse cx="32" cy="17" rx="${soCanh>6?7:9}" ry="14" fill="${mau}" transform="rotate(${360/soCanh*k} 32 32)"/>`;
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${canh}<circle cx="32" cy="32" r="9" fill="#FFE08A" stroke="#F2B544" stroke-width="2"/><circle cx="29" cy="30" r="1.6" fill="#7A5134"/><circle cx="35" cy="30" r="1.6" fill="#7A5134"/><path d="M28.5 34.5q3.5 3 7 0" stroke="#7A5134" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
}
const theAnh = (a, lop='anh-that', them='') => `<img class="${lop}" src="${esc(a.tep)}" alt="${esc(a.chu)}" loading="lazy" onerror="this.classList.add('hong')" ${them}>`;
function homNay(){
  const q = new URLSearchParams(location.search).get('ngay'), t = new Date();
  if (q){ const d = new Date(q+'T00:00:00'); if(!isNaN(d)){ d.setHours(t.getHours(), t.getMinutes()); return d; } }
  return t;
}
const HN = homNay();
const ngay0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const soNgay = (a,b) => Math.round((ngay0(b)-ngay0(a))/864e5);
const pd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const pdVN = s => { const [d,m,y]=s.split('/').map(Number); return new Date(y,m-1,d); };
function chuanHoaMa(s){
  s = (s||'').trim();
  const tach = s.split(/[\/\.\-\s]+/).filter(Boolean);
  if (tach.length>=2) return tach[0].padStart(2,'0')+tach[1].padStart(2,'0');
  return s.replace(/\D/g,'');
}
function sinhNhatToi(ddmm){
  const [d,m] = ddmm.split('/').map(Number);
  let sn = new Date(HN.getFullYear(), m-1, d);
  if (soNgay(HN, sn) < -3) sn = new Date(HN.getFullYear()+1, m-1, d);
  return { ngay: sn, con: soNgay(HN, sn) };
}
const KHOA_LUU = 'lop-c4';
const luu = v => { try{ localStorage.setItem(KHOA_LUU, JSON.stringify(v)); }catch(e){} };
const docLuu = () => { try{ return JSON.parse(localStorage.getItem(KHOA_LUU)); }catch(e){ return null; } };
const xoaLuu = () => { try{ localStorage.removeItem(KHOA_LUU); }catch(e){} };

/* ================= Ảnh tự động theo TÊN FILE =================
   Không cần thư mục. Anh chỉ cần tải ảnh lên repo, đặt tên bắt đầu bằng:
   trung-thu-..., 20-10-..., 20-11-..., khai-giang-..., tet-..., 8-3-..., tong-ket-...  -> album dịp đó
   mixue-..., bao-ngoc-..., nh-tue-nhi-...  (tên ghi ở "tenAnh" của từng bé)          -> ảnh riêng của bé
   <tên bé>-dai-dien.jpg                                                              -> ảnh đại diện
   co-voi-lop-...                                                                     -> ảnh cô với các con
   HOẶC để ảnh trong thư mục cùng tên: anh/trung-thu/, anh/mixue/ (ảnh "dai-dien.jpg" là ảnh đại diện).
   (Công cụ nen-anh.html tự đặt tên đúng.) */
let ANH_DS = [];
let AM_DS = [];   // ghi âm giọng các con: anh/<tenAnh>/*.m4a|mp3|aac
const DUOI_AM = /\.(m4a|mp3|aac|wav|ogg)$/i;
const DUOI_ANH = /\.(jpe?g|png|webp|gif|avif)$/i;
const soSanhTen = (a,b) => a.localeCompare(b, 'vi', {numeric:true});
const tenFile = p => p.slice(p.lastIndexOf('/')+1).toLowerCase();
function khoRepo(){
  const h = location.hostname;
  if (!h.endsWith('.github.io')) return null;
  const doan = location.pathname.split('/').filter(Boolean);
  return { chu: h.split('.')[0], repo: (doan.length && !/\.html?$/.test(doan[0])) ? doan[0] : h };
}
async function taiDanhSachAnh(){
  try{ const c = JSON.parse(localStorage.getItem('lop-c4-anh2')); if (c && c.ds){ ANH_DS = c.ds; AM_DS = c.am || []; veCayCong(); } }catch(e){}
  const kho = khoRepo(); if (!kho) return;
  try{
    const r = await fetch(`https://api.github.com/repos/${kho.chu}/${kho.repo}/git/trees/HEAD?recursive=1`);
    if (!r.ok) return;
    const cay = (await r.json()).tree.filter(x=>x.type==='blob');
    const ds = cay.filter(x=>DUOI_ANH.test(x.path) && x.path!=='og.png').map(x=>x.path).sort((a,b)=>soSanhTen(tenFile(a),tenFile(b)));
    const am = cay.filter(x=>DUOI_AM.test(x.path) && x.path.startsWith('anh/')).map(x=>x.path).sort((a,b)=>soSanhTen(tenFile(a),tenFile(b)));
    const doi = JSON.stringify(ds) !== JSON.stringify(ANH_DS) || JSON.stringify(am) !== JSON.stringify(AM_DS);
    ANH_DS = ds; AM_DS = am;
    try{ localStorage.setItem('lop-c4-anh2', JSON.stringify({t:Date.now(), ds, am})); }catch(e){}
    if (doi){ veCayCong(); if (NGUOI) doiTab(TAB, false, false); }
  }catch(e){}
}
// Ảnh thuộc mục "tt" nếu: nằm trong thư mục tên tt (vd anh/trung-thu/, anh/mixue/, anh/12-mixue/)
// hoặc tên file bắt đầu bằng "tt-" (vd trung-thu-01.jpg, mixue-dai-dien.jpg)
const thuMucCua = p => { const k = p.split('/'); return k.length>1 ? k[k.length-2].toLowerCase() : ''; };
const TEN_DA_DUNG = new Set([...L.be.map(b=>b.tenAnh), ...(L.moc||[]).map(m=>m.tenAnh)].filter(Boolean));
const trongThuMuc = (p, tt) => { const m = thuMucCua(p); return m===tt || (m.endsWith('-'+tt) && !TEN_DA_DUNG.has(m)); };   // 'nh-tue-nhi' là của bạn khác, không tính cho 'tue-nhi'
const theoTen = tt => !tt ? [] : ANH_DS.filter(p=>{ const f = tenFile(p); return trongThuMuc(p,tt) || (f.startsWith(tt+'-') && ![...TEN_DA_DUNG].some(k=>k!==tt && k.startsWith(tt+'-') && f.startsWith(k+'-'))) || f.replace(DUOI_ANH,'')===tt; }).map(p=>({tep:p, chu:''}));
// Ảnh nhỏ (160px) cho cây ở trang đầu: anh/nho/nho-<tenAnh>.jpg; chưa có thì dùng ảnh đại diện gốc
const anhNhoCua = i => { const tt = L.be[i].tenAnh, p = tt && `anh/nho/nho-${tt}.jpg`;
  if (p && ANH_DS.includes(p)) return p; const dd = anhDaiDienCua(i); return dd && dd.tep ? dd.tep : null; };
const hinhCay = i => { const p = anhNhoCua(i); return p ? `<img class="anh-tron" src="${esc(p)}" alt="" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(svgHoa(${i})))">` : svgHoa(i); };
const anhCuoiNamCua = i => { const tt = L.be[i].tenAnh; return tt ? theoTen(tt).find(a=>/^cuoi-nam/.test(tenFile(a.tep))) : null; };
const giongCua = i => { const tt = L.be[i].tenAnh; return !tt ? [] : AM_DS.filter(p=>trongThuMuc(p,tt) || tenFile(p).startsWith(tt+'-')); };
const theGiong = p => `<audio class="giong" src="${esc(p)}" controls preload="none"></audio>`;
function gop(...nhom){ const da = new Set(), kq = [];
  nhom.flat().forEach(a=>{ if (a && a.tep && !da.has(a.tep)){ da.add(a.tep); kq.push(a); } }); return kq; }
function anhDaiDienCua(i){
  const b = L.be[i], dd = chuanAnh(b.anhDaiDien); if (dd && dd.tep) return dd;
  const ds = theoTen(b.tenAnh); if (!ds.length) return null;
  return ds.find(a=>{ const f = tenFile(a.tep); return f.startsWith(b.tenAnh+'-dai-dien') || (trongThuMuc(a.tep,b.tenAnh) && f.startsWith('dai-dien')); }) || null;   // chỉ dùng ảnh tên dai-dien, không lấy bừa ảnh đầu tiên
}
const anhRiengCua = i => gop(dsAnh(L.be[i].anh), theoTen(L.be[i].tenAnh).filter(a=>!/^([a-z0-9-]+-)?(dai-dien|cuoi-nam)/.test(tenFile(a.tep))));   // ảnh đại diện (đã cắt vuông) không lặp lại trong album
const anhMoc = m => gop(dsAnh(m.anh), theoTen(m.tenAnh));
const anhLopCo = () => chuanAnh(L.anhCoVoiLop) && chuanAnh(L.anhCoVoiLop).tep ? chuanAnh(L.anhCoVoiLop) : theoTen('co-voi-lop')[0] || null;
const anhCuaCo = () => gop(dsAnh(L.anhCo), theoTen('co-voi-lop'));

/* ================= Nhạc nền =================
   Nếu repo có file nhac.mp3 thì phát file đó (lặp lại). Không có thì phát giai điệu hộp nhạc
   do trang tự tạo (giai điệu tự sáng tác, không vướng bản quyền).
   Trình duyệt chỉ cho phát nhạc sau khi người xem chạm vào trang, nên nhạc bắt đầu khi bố mẹ vào lớp. */
const NHAC = { bat: (()=>{ try{ return localStorage.getItem('lop-c4-nhac') !== 'tat'; }catch(e){ return true; } })(), dangPhat:false, audio:null, ctx:null, hen:null, coFile:null };
const GIAI_DIEU = [ // [nốt MIDI, số phách] — nhịp 3/4
  [76,1],[79,1],[81,1],[79,2],[76,1],[74,1],[76,1],[79,1],[72,3],
  [76,1],[79,1],[84,1],[83,2],[81,1],[79,1],[81,1],[76,1],[74,3],
  [76,1],[79,1],[81,1],[84,2],[81,1],[79,1],[76,1],[74,1],[76,3],
  [74,1],[76,1],[79,1],[81,2],[79,1],[76,1],[74,1],[74,1],[72,3]];
const BE_TRAM = [48,48,43,48, 48,43,45,43, 41,41,43,48, 48,41,43,48]; // nốt gốc mỗi ô nhịp
const hz = n => 440*Math.pow(2,(n-69)/12);
function notHop(ctx, dich, n, luc, dai, to){
  [[1,'sine',1],[2,'sine',.25],[4,'triangle',.06]].forEach(([boi,kieu,am])=>{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = kieu; o.frequency.value = hz(n)*boi;
    g.gain.setValueAtTime(0, luc); g.gain.linearRampToValueAtTime(to*am, luc+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, luc+dai);
    o.connect(g); g.connect(dich); o.start(luc); o.stop(luc+dai+0.05);
  });
}
function phatHopNhac(){
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = NHAC.ctx || (NHAC.ctx = new AC()); ctx.resume();
  const tong = ctx.createGain(); tong.gain.value = 0.22; tong.connect(ctx.destination); NHAC.tong = tong;
  const phach = 0.6, dai = GIAI_DIEU.reduce((s,x)=>s+x[1],0)*phach;
  let batDau = ctx.currentTime + 0.15;
  const lenLich = ()=>{
    let t = batDau;
    GIAI_DIEU.forEach(([n,p])=>{ notHop(ctx, tong, n, t, Math.max(1.2, p*phach*1.6), 0.5); t += p*phach; });
    BE_TRAM.forEach((n,k)=>{ const o = batDau + k*3*phach; notHop(ctx, tong, n, o, 2.2, 0.28); notHop(ctx, tong, n+7, o+phach, 1.2, 0.14); notHop(ctx, tong, n+12, o+2*phach, 1.2, 0.12); });
    batDau += dai + phach*3;  // nghỉ một ô rồi lặp
    NHAC.hen = setTimeout(lenLich, (batDau - ctx.currentTime - 1.5)*1000);
  };
  lenLich();
}
function dungHopNhac(){ clearTimeout(NHAC.hen); if (NHAC.tong){ const g = NHAC.tong; try{ g.gain.setTargetAtTime(0, NHAC.ctx.currentTime, 0.2); }catch(e){} setTimeout(()=>g.disconnect(), 800); NHAC.tong = null; } }

/* Xếp tên các con thành tán cây: hàng hẹp ở ngọn và gốc, hàng rộng ở giữa.
   Tên ngắn lên ngọn/xuống gốc, tên dài vào giữa; 2 bé sinh đôi luôn đứng cạnh nhau. */
function mauHang(n){
  const rong = Math.min(window.innerWidth - 32, 528);
  let m = rong >= 470 ? [2,4,5,6,6,5,3] : [1,3,4,5,5,5,4,3,1];
  let tong = m.reduce((a,b)=>a+b,0), k = Math.floor(m.length/2);
  while (tong < n){ m[k]++; tong++; k = (k+1) % m.length; }
  while (tong > n){ const j = m.indexOf(Math.max(...m)); m[j]--; tong--; }
  return m;
}
function xepCay(){
  const n = L.be.length, m = mauHang(n);
  const doDai = i => L.be[i].goi.length;
  const daXep = new Set(), donVi = [];
  L.be.forEach((b,i)=>{ if (daXep.has(i)) return;
    if (sinhDoi.includes(i)){ sinhDoi.forEach(k=>daXep.add(k)); donVi.push(sinhDoi.slice()); }
    else { daXep.add(i); donVi.push([i]); } });
  donVi.sort((a,b)=> Math.max(...b.map(doDai)) - Math.max(...a.map(doDai)));
  const giua = (m.length-1)/2, hang = m.map(()=>[]);
  donVi.forEach(dv=>{
    let tot = -1;
    m.forEach((c,r)=>{ const con = c - hang[r].length; if (con < dv.length) return;
      if (tot<0) { tot=r; return; }
      const conTot = m[tot]-hang[tot].length;
      if (con > conTot || (con===conTot && Math.abs(r-giua) < Math.abs(tot-giua))) tot = r; });
    if (tot<0) tot = Math.round(giua);
    hang[tot].push(...dv);
  });
  // trong mỗi hàng: xen kẽ cho đều mắt, giữ sinh đôi liền nhau
  return hang.map(ds=>{
    const nhom = []; ds.forEach(i=>{ const cuoi = nhom[nhom.length-1];
      if (cuoi && sinhDoi.includes(i) && sinhDoi.includes(cuoi[0])) cuoi.push(i); else nhom.push([i]); });
    const xen = []; nhom.forEach((g,k)=> k%2 ? xen.push(...g) : xen.unshift(...g));
    return xen;
  });
}
let XEP = null;
const veTan = veMot => { const X = XEP || (XEP = xepCay()), g = (X.length-1)/2;
  return X.map((h,r)=>`<div class="hang">${h.map(veMot).join('')}</div>`).join(''); };

function videoHTML(url){
  if (!url) return '<div class="anh-gia" style="margin-top:10px">Clip các con gửi cô sẽ đặt ở đây</div>';
  const yt = url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  if (!yt && /\.(mp4|webm|mov)$/i.test(url)) return `<video src="${esc(url)}" controls playsinline style="width:100%;border-radius:16px;margin-top:10px"></video>`;
  const src = yt ? `https://www.youtube-nocookie.com/embed/${yt[1]}?rel=0` : url;
  return `<div class="video"><iframe src="${esc(src)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
}

/* ================= Thẻ "Bạn nhỏ lớp C4" (vẽ bằng canvas, tải về PNG) ================= */
const taiAnh = src => new Promise((ok, loi)=>{ const im = new Image(); im.onload = ()=>ok(im); im.onerror = loi; im.src = src; });
async function veThe(i){
  const b = L.be[i], W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  try{ await document.fonts.ready; }catch(e){}
  const F = (w, s, f) => `${w} ${s}px ${f}`;
  // nền
  const nen = g.createLinearGradient(0,0,0,H); nen.addColorStop(0,'#E8F5DC'); nen.addColorStop(1,'#FFF8EC'); g.fillStyle = nen; g.fillRect(0,0,W,H);
  const hoaNho = (x,y,r,mau)=>{ g.fillStyle = mau; for (let k=0;k<5;k++){ const a = k*Math.PI*2/5; g.beginPath(); g.arc(x+Math.cos(a)*r*.6, y+Math.sin(a)*r*.6, r*.45, 0, 7); g.fill(); } g.fillStyle='#FFE08A'; g.beginPath(); g.arc(x,y,r*.32,0,7); g.fill(); };
  [[90,110,38,'#F7A8B4'],[990,150,30,'#FFD166'],[120,1230,32,'#B8A9F0'],[960,1220,40,'#8FD3E8'],[70,650,22,'#FFB077'],[1010,700,24,'#A0D995']].forEach(h=>hoaNho(...h));
  // thẻ trắng
  const r = (x,y,w,h,rr)=>{ g.beginPath(); g.moveTo(x+rr,y); g.arcTo(x+w,y,x+w,y+h,rr); g.arcTo(x+w,y+h,x,y+h,rr); g.arcTo(x,y+h,x,y,rr); g.arcTo(x,y,x+w,y,rr); g.closePath(); };
  g.save(); g.shadowColor='rgba(120,80,40,.18)'; g.shadowBlur=40; g.shadowOffsetY=12; g.fillStyle='#fff'; r(110,170,860,1010,56); g.fill(); g.restore();
  g.fillStyle='#4F8A3C'; r(110,170,860,150,56); g.fill(); g.fillRect(110,260,860,60);
  g.textAlign='center'; g.fillStyle='#fff'; g.font=F(800,64,"'Baloo 2', system-ui"); g.fillText('Bạn nhỏ lớp C4', W/2, 262);
  // ảnh tròn
  const cx = W/2, cy = 600, R = 230;
  g.fillStyle='#CFE8B8'; g.beginPath(); g.arc(cx,cy,R+22,0,7); g.fill();
  const p = anhNhoCua(i) && anhDaiDienCua(i) ? anhDaiDienCua(i).tep : null;
  try{
    const im = p ? await taiAnh(p) : await taiAnh('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgHoa(i).replace('<svg','<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"')));
    g.save(); g.beginPath(); g.arc(cx,cy,R,0,7); g.clip(); g.fillStyle='#FFF8EC'; g.fillRect(cx-R,cy-R,2*R,2*R);
    if (p){ const s = Math.max(2*R/im.width, 2*R/im.height); g.drawImage(im, cx-im.width*s/2, cy-im.height*s/2, im.width*s, im.height*s); }
    else g.drawImage(im, cx-R*.8, cy-R*.8, R*1.6, R*1.6);
    g.restore();
  }catch(e){}
  g.lineWidth=12; g.strokeStyle='#fff'; g.beginPath(); g.arc(cx,cy,R,0,7); g.stroke();
  // chữ
  g.fillStyle='#4A3B2C'; g.font=F(800,108,"'Baloo 2', system-ui"); g.fillText(b.goi, cx, 950);
  g.fillStyle='#8A7663'; g.font=F(500,40,"'Be Vietnam Pro', system-ui"); g.fillText(b.ten, cx, 1010);
  g.fillStyle='#E46C86'; g.font=F(600,40,"'Be Vietnam Pro', system-ui"); g.fillText(`🎂 Sinh ngày ${b.sn}`, cx, 1080);
  g.fillStyle='#4F8A3C'; g.font=F(600,34,"'Be Vietnam Pro', system-ui"); g.fillText(`Mẫu giáo bé C4 · MN Uy Nỗ · ${L.lop.namHoc}`, cx, 1140);
